<!DOCTYPE html>
<html lang="en">
<head>
    <link rel="stylesheet" href="style.css">
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Ubuntu:ital,wght@0,300;0,400;0,500;0,700;1,300;1,400;1,500;1,700&display=swap" rel="stylesheet">
    <script type="module" src="https://unpkg.com/ionicons@7.1.0/dist/ionicons/ionicons.esm.js"></script>
    <title>accessible-form-UI</title>
</head>
<body>
    <div class="Container ubuntu-regular">
        <div class="content">
            <form action="">
                <label for="name">Full Name</label>
                <input type="text"  placeholder="What should we call you?">
                <label for="email">Email</label>
                <input class="color" type="email" placeholder="john@doe.com">
                <!-- <div style="color: red; margin-bottom: 26px;">Email is already taken</div> -->
                <div class="password-field">
                    <label for="password">Enter Password</label>

                    <div class="password">
                        <input type="checkbox" class="password-toggle" checked>
                        <div class="toggle-eye open">
                            <ion-icon name="eye"></ion-icon>
                        </div>
                        <div class="toggle-eye close">
                            <ion-icon name="eye-off"></ion-icon>    
                        </div>
                        <input type="text" class="password-input" placeholder="xxxxxxxx">
                    </div>
                    <div class="confirmPassword">
                        <label for="password">Confirm Password</label>
                        <!-- <input type="password"  placeholder="xxxxxxxx"> -->
                        <div class="password">
                            <input type="checkbox" class="password-toggle" checked>
                            <div class="toggle-eye open">
                                <ion-icon name="eye"></ion-icon>
                            </div>
                            <div class="toggle-eye close">
                                <ion-icon name="eye-off"></ion-icon>   
                            </div>
                            <input type="text" class="password-input" placeholder="xxxxxxxx">
                        </div>
                    </div>                    
                </div>
                <input class="button" type="submit" value="Update Profile">
            </form>
        </div>
        <div class="listContainer">   
            <div class="processContainer"> 
                <div class="progressCircle">65%</div>
                <div class="profileText">Profile Completeness</div>
            </div>
            <div class="checkColor">
                <ul class="checklist">
                    <li><strike>Create Account</strike></li>
                    <li><strike> Update Roadmap Progress</strike></li>
                    <li><strike>Setup Public Profile</strike></li>
                    <li>Complete your first project</li>
                    <li>Invite your Friends</li>
                </ul> 
            </div>     
        </div>
    </div>
</body>
</html>
