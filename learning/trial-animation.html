<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        *{
            margin: 0;
            padding: 0;
            box-sizing: content-box;
        }
        .bg{
            background: rgb(55, 55, 55);
            height: 10%;
            position: relative;
            width: 450px;
            height: 450px;
            /* border-radius: 50%; */
            margin: 5em auto auto;

        }
        .box{
            background: red;
            width: 50px;
            height: 50px;
            top: 00px; 
            left: 00px;
            /* margin: 10em; */
            /* border: 1px solid; */
            animation: demo 2s 5s ease infinite;
            border-radius: 50%;
            box-shadow: 0 0 15px rgba(0,0,0,0.1); 
            position: absolute;
        }
        @keyframes demo {
            0%{background: red; top: 0px;left: 0px;}
            25%{background: rgb(246, 255, 0);top: 0px; left: 400px; }
            50%{background: green; top: 400px; left: 400px;}
            75%{background: rgb(0, 255, 187); top: 400px;left: 0px;}
           100%{background: red; top: 0px;left: 0px;}
        }
    </style>
</head>
<body>
    <div class="bg">
        <div class="box"></div>
    </div>
</body>
</html>
