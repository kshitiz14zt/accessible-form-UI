<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <style>
        .box{
            width: 90%;
            height: 20px;
            background: black;
            margin-left: 20px;
            animation: sample 2s 1s;
            animation-iteration-count: 3s;
            animation-fill-mode: both;
            /* animation-play-state: paused; */
        }
        .box:hover{
            animation-play-state: running;
        }
        @keyframes sample {
            0%{background: yellow; width: 25%;}
            50%{background: green; width: 50%;}
            100%{background: red; width: 90%;}
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
