    <style>
        *{
    padding: 0;
    margin: 0;
    box-sizing: content-box;
}
form{
    width: 100%;
}
.horizentalBar{
    /* width: 600px; */
    height: 20px;
    /* border: 2px solid black; */
    margin-left: 6em;
    margin-bottom: 2em;
    border-radius: 18px;
    background: #ddd;
    overflow: hidden;
}
.fill{
    height: 100%;
    width: 0%;
    background: #000000;;
    transition: width 0.2s;
}
    input:valid:nth-of-type(1) ~ .horizentalBar .fill {
      width: 25%;
    }
    input:valid:nth-of-type(2) ~ .horizentalBar .fill {
      width: 50%;
    }
    input:valid:nth-of-type(3) ~ .horizentalBar .fill {
      width: 75% ;
    }
    input :valid:nth-of-type(4) ~ .horizentalBar .fill {
      width: 100%;
    }
.password {
    border-radius: 10px; 
    position: relative; 
} 
.password-toggle{
    width: 34px;
    height: 36px;
    position: absolute;
    right: 14px;
    z-index: 1;
    appearance: none;
    cursor: pointer;
    top: 2px;
    border: 1px solid transparent;
    right: -2px;
}
.toggle-eye{
    position: absolute;
    right: 0;
    font-size: 34px;
    top: 16px;
}
.password-input{ 
    -webkit-text-security: disc; 
    padding-left: 10px;
}
.password-toggle:checked ~ .password-input{
    -webkit-text-security:none;
}
.password-toggle:checked ~ .toggle-eye.close{
    opacity: 0;    
}
.Container{
    border: 2px solid black;
    margin: 4px;
    border-radius: 28px;
    width: 100%;
    display: flex;
}
.content{
    padding: 12px;
    width: 50%;
}
input{
    width: 100%;
    height: 2.8em;
    margin-top: 12px;
    border-radius: 16px;
    font-family: "Ubuntu", sans-serif;
    margin-bottom: 26px;
    font-size: 22px;
    border: 2px solid;
    padding-left: 10px;
    display: block;
}
input::placeholder{
    font-size: 28px;
    color: #c1bebe;
    /* padding-left: 16px; */
}
label{
    font-size: 28px;
    display: block;
}
.ubuntu-regular {
    font-family: "Ubuntu", sans-serif;
    font-weight: 400;
    font-style: normal;
}
.password-field {
    position: relative;
}
.fa-eye {
    position: absolute;
    right: 10px;
    top: 25%;
    cursor: pointer;
}
.confirmPassword {
    position: relative;
}
.fa-eyes {
    position: absolute;
    right: 10px;
    top: 56%;
    cursor: pointer; 
}
.fa-eyes:before {
    content: "\f06e";
}
.button{
    background-color: black;
    color: aliceblue;
    height:2.8em;
    font-size: 28px;
}
.profileText{
    font-size: 24px;
    margin-top: 10px;
    margin-left: 28px;
    text-align: center;
}
strike{
    color: #b6b3b3;
}
.checkColor{
    background-color:#ebebeb;
    border-radius: 28px;
    margin-left: 4.6em;
}
ul.checklist{
    list-style: none;
    line-height: 32px;
    padding: 34px;
}

.button:hover{
    background: lightblue;
    color: red;
    border: 1px solid black;
    cursor: pointer;
}
@media screen and (min-width:1024px) {
    .Container{
        display: flex;
        padding: 44px 68px 30px 44px;

        margin: 80px auto;
        gap: 8px;

    .content{

    ul.checklist{

        line-height: 45px;
        margin-top: 28px;
    }
    .profileText{
        margin-left: 3em;
        margin-top: 1em;
        font-size: 30px;
    }
    .progressCircle{
        margin-left: 5em;
    }
    .button{
        width: 95%;
    }
}
