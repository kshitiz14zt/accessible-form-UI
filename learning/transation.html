<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Css Transation</title>
    <style>
        .box{
            width: 150px;
            height: 150px;
            background: red;
            /* transition: width,height,background,2s,2s,2s; */
            transition-property: all;
            transition-duration: 2s;
            transition-delay: 2s;
            transition-timing-function: ease; 
        }
        .box:hover{
            width: 300px;
            /* height: 30px; */
            background: yellow;
            /* border-radius: 50%; */
        }
    </style>
</head>
<body>
    <div class="box"></div>
</body>
</html>
